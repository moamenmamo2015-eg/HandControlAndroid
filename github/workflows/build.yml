name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          unzip -q -o HandControlAndroid.zip -d src
          cd src/HandControlAndroid
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/HandControl.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          make_latest: "true"
          files: HandControl.apk
